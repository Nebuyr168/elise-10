name: Refresh Elise-10 data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch orders from Shopify
        env:
          SHOPIFY_STORE: ubpnh9-84.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          if [ -z "$SHOPIFY_CLIENT_ID" ] || [ -z "$SHOPIFY_CLIENT_SECRET" ]; then
            echo "::warning::Secrets SHOPIFY_CLIENT_ID and SHOPIFY_CLIENT_SECRET are not set. Add them in Settings > Secrets and variables > Actions. Data was not refreshed."
            exit 0
          fi
          node scripts/fetch.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/elise-10.json
          if git diff --cached --quiet; then
            echo "No change in data"
          else
            git commit -m "chore: refresh Elise-10 data"
            git push
          fi
